services:
  node1:
    build: .
    image: mc714-task-node
    environment:
      NODE_ID: "1"
      PEERS: "1=http://node1:8000,2=http://node2:8000,3=http://node3:8000"
      DB_PATH: "/data/tasks.db"
    ports:
      - "8001:8000"

  node2:
    build: .
    image: mc714-task-node
    environment:
      NODE_ID: "2"
      PEERS: "1=http://node1:8000,2=http://node2:8000,3=http://node3:8000"
      DB_PATH: "/data/tasks.db"
    ports:
      - "8002:8000"

  node3:
    build: .
    image: mc714-task-node
    environment:
      NODE_ID: "3"
      PEERS: "1=http://node1:8000,2=http://node2:8000,3=http://node3:8000"
      DB_PATH: "/data/tasks.db"
    ports:
      - "8003:8000"
